# Setting jvmargs replaces Gradle's defaults: keep the --add-opens set AGP
# needs on JDK 17 (JvmWideVariable), else validateSigningDebug fails.
# -XX:-UseContainerSupport: JDK 17.0.2 NPEs in cgroup v2 detection on WSL2
# (JMX MBeanServer init -> JvmWideVariable ExceptionInInitializerError).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:-UseContainerSupport --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.security=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
