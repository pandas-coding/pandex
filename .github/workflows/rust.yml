name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-4-dev
          libgstreamer1.0-dev
          libgstreamer-plugins-base1.0-dev
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'nsh.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSH CLI
        shell: pwsh
        run: |
          irm https://nsh.dev/install.ps1 | iex
          $nshBin = Join-Path $env:LOCALAPPDATA 'nsh\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $nshBin
          & (Join-Path $nshBin 'nsh.exe') --version
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'nsh.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Package Windows app
        shell: pwsh
        run: nsh package --target windows --out .nsh/out
      - name: Smoke test Windows package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path .nsh/out -Recurse -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) {
            throw "Windows package did not contain an executable"
          }

          $zip = Get-ChildItem -Path .nsh/out -Recurse -Filter *.zip | Select-Object -First 1
          if ($null -eq $zip) {
            throw "Windows package did not contain a zip bundle"
          }

          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Packaged Windows executable exited during smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pandex-windows
          path: .nsh/out
          if-no-files-found: error
